[package]
name = "rhi"
version = "0.1.0"
edition = "2024"
authors = ["Radroots Authors"]
rust-version = "1.97.1"
license = "AGPL-3.0-or-later"
description = "Radroots trade agreement attestation worker"

[workspace]
resolver = "3"

[workspace.dependencies]
radroots_event = "=0.1.0-alpha"
radroots_event_codec = "=0.1.0-alpha"
radroots_identity = "=0.1.0-alpha"
radroots_nostr = "=0.1.0-alpha"
radroots_protocol = "=0.1.0-alpha"
radroots_secrets = "=0.1.0-alpha"
radroots_trade = "=0.1.0-alpha"

[features]
default = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[dependencies]
radroots_event = { workspace = true, features = ["serde"] }
radroots_event_codec = { workspace = true, features = ["json"] }
radroots_identity = { workspace = true }
radroots_nostr = { workspace = true, features = ["events"] }
radroots_protocol = { workspace = true }
radroots_secrets = { workspace = true }
radroots_trade = { workspace = true }

anyhow = { version = "1" }
chacha20poly1305 = { version = "0.10" }
clap = { version = "4", features = ["derive"] }
futures-executor = { version = "0.3" }
nostr = { version = "0.44.7", features = ["nip49"] }
nostr-sdk = { version = "0.44.1" }
rand = { version = "0.9" }
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false }
sha2 = { version = "0.10" }
tokio = { version = "1", features = ["full"] }
thiserror = { version = "2" }
tempfile = { version = "3" }
toml = { version = "0.8" }
tracing = { version = "0.1" }
tracing-appender = { version = "0.2" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1" }

[dev-dependencies]
