schema = "radroots.rhi.config"
schema_version = 1

[service]
shutdown_grace_ms = 30000

[logging]
level = "info"
format = "json"

[operations]
enabled = false

[database]
busy_timeout_ms = 5000
max_connections = 8
minimum_free_bytes = 268435456

[identity.service]
provider = "encrypted_file"
envelope_path = "/var/lib/radroots/services/rhi/default/secrets/service.identity.ncrypt"
credential_reference = "service_wrapping_key"
expected_public_key = "2222222222222222222222222222222222222222222222222222222222222222"

[[relays]]
id = "relay-primary"
url = "wss://relay.example.com/"
read = true
write = true
required = true
authentication = "required"

[[relays]]
id = "relay-secondary"
url = "wss://relay-secondary.example.com/"
read = false
write = true
required = false
authentication = "none"

[network]
connect_deadline_ms = 10000
dns_answer_limit = 16

[evidence]
contract = "radroots.rhi.evidence-policy"
contract_version = 1
policy_id = "production-primary"

[[evidence.sources]]
source_id = "trade-primary"
kind = "nostr_relay"
relay_id = "relay-primary"
required = true
selector = "trade_mutation_lineage_v1"
deadline_ms = 10000
lookback_seconds = 86400
overlap_seconds = 300

[reconciliation]
concurrency = 8
queue_capacity = 4096
lease_ms = 30000
lease_renewal_ms = 10000
max_attempts = 10
initial_backoff_ms = 250
maximum_backoff_ms = 30000
attempt_deadline_ms = 30000

[attestation]
contract = "radroots.rhi.evidence_attestation.v1"
contract_version = 1
method = "signed_evidence_snapshot"
reducer_contract = "radroots.trade.reducer.v1"
reducer_contract_version = 1

[publication]
mode = "required"
target_relay_ids = ["relay-primary", "relay-secondary"]

[publication.retry]
max_attempts = 10
initial_backoff_ms = 250
maximum_backoff_ms = 30000
attempt_deadline_ms = 15000

[presence]
enabled = true
profile = true
application_handler = true
target_relay_ids = ["relay-primary", "relay-secondary"]

[resource_limits.admin]
header_count = 32
header_bytes = 16384
request_body_utf8_bytes = 65536
response_body_utf8_bytes = 1048576
concurrent_connections = 32
request_deadline_ms = 15000
idle_timeout_ms = 30000
query_items = 100

[resource_limits.events]
wire_bytes = 262144
content_bytes = 131072
tag_count = 1024
tag_total_elements = 4096
tag_element_bytes = 4096
tag_total_bytes = 131072

[resource_limits.source_results]
events = 4096
bytes = 8388608

[resource_limits.queues]
ingress = 1024
reconciliation = 4096
publication = 4096
presence = 64

[resource_limits.metrics]
descriptors = 64
samples = 512
labels_per_sample = 8
render_utf8_bytes = 1048576

[resource_limits.runtime]
worker_threads = 4
blocking_threads = 8

[retention]
duplicate_observations_ms = 604800000
completed_jobs_ms = 2592000000
terminal_publication_attempts_ms = 2592000000
terminal_presence_attempts_ms = 2592000000
operation_dedup_ms = 604800000
audit_ms = 31536000000
